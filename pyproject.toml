[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcontract"
version = "0.1.0"
description = "Runtime constraint tracking and evidence-grounded verification for long-horizon agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AgentContract contributors" }
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcontract"]
